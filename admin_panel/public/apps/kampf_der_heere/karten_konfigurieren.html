<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karten Konfigurieren</title>
    <link rel="stylesheet" href="/apps/kampf_der_heere/styles.css">
</head>
<body>
    <h1>Karten Konfigurieren</h1>
    <div class="karten-form">
        <label for="kartenname">Kartenname:</label>
        <input type="text" id="kartenname" name="kartenname">
        <label for="angriff">Angriff:</label>
        <input type="number" id="angriff" name="angriff">
        <label for="verteidigung">Verteidigung:</label>
        <input type="number" id="verteidigung" name="verteidigung">
        <label for="bild">Bild:</label>
        <input type="file" id="bild" name="bild">
        <label for="beschreibung">Beschreibung:</label>
        <textarea id="beschreibung" name="beschreibung"></textarea>
        <button type="submit">Karte speichern</button>
    </div>
</body>
</html>
