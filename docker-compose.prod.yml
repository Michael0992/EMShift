services:
  admin-panel:
    build: ./admin_panel
    restart: unless-stopped
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  kampfderheere:
    build: ./kampfderheere
    restart: unless-stopped
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin-panel
      - kampfderheere

  db:
    image: mariadb:12
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  clouflared:
    image: cloudflare/cloudflared:latest
    comand: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx

volumes:
  db-data:
